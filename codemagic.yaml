workflows:
  ios-unsigned-ipa:
    name: Build iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install & Sync Capacitor iOS
        script: |
          npm install
          npx cap add ios
          npx cap sync ios
      - name: Build Unsigned IPA
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build SYMROOT=build
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -r ../../LNVMKCT_HKD_2026_unsigned.ipa Payload
    artifacts:
      - LNVMKCT_HKD_2026_unsigned.ipa
