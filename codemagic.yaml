workflows:
  ios-unsigned-ipa:
    name: Build iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install & Sync Capacitor iOS
        script: |
          npm install
          npx cap add ios
          npx cap sync ios
      - name: Build Unsigned IPA
        script: |
          set -e
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_out \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH=$(find build_out -name "App.app" -type d | head -n 1)
          echo "Found App.app at: $APP_PATH"
          test -f "$APP_PATH/Info.plist"
          rm -rf Payload
          mkdir -p Payload
          ditto "$APP_PATH" Payload/App.app
          zip -qry ../../LNVMKCT_HKD_2026_unsigned.ipa Payload
          ls -lh ../../LNVMKCT_HKD_2026_unsigned.ipa
    artifacts:
      - LNVMKCT_HKD_2026_unsigned.ipa
